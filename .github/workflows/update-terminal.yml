name: Atualizar terminal do perfil

on:
  schedule:
    - cron: "0 6 1 */2 *"
  workflow_dispatch:            
  push:
    branches: [main]
    paths: ["terminal/**"]   

permissions:
  contents: write               

concurrency:
  group: update-terminal
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: terminal/requirements.txt

      - name: Instalar dependências
        run: pip install -r terminal/requirements.txt

      - name: Gerar o GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }} 
        run: python terminal/main.py

      - name: Commitar o GIF (só se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.gif
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualiza terminal"
            git pull --rebase
            git push
          fi
